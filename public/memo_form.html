<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모 게시판</title>

    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/memo_form.css">
</head>

<body class="form-page">

    <form action="/users/logout" method="post" class="logout-form">
        <button type="submit" class="btn btn-logout">로그아웃</button>
    </form>
    
    <form id="memo-form" class="form-container">
        <h1>새 메모 작성</h1>

        <div class="form-group">
            <label for="memo_type">분류</label>
            <select id="memo_type" name="memo_type" required>
                <option value="일기">일기</option>
                <option value="프로그래밍">프로그래밍</option>
                <option value="기타">기타</option>
            </select>
        </div>
        <div class="form-group">
            <label for="memo_title">메모 제목:</label>
            <input type="text" id="memo_title" name="memo_title" required>
        </div>
        <div class="form-group">
            <label for="memo_content">메모 내용:</label>
            <textarea id="memo_content" name="memo_content" rows="10" cols="38" required></textarea>
        </div>

        <button type="submit" class="btn-submit">작성하기</button>
    
        <div class="link-container">
            <a href="/memo_list.html" class="link-to-list">내 메모 목록 보기</a>
        </div>
    </form>
    
    <div id="toast-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/common.js"></script> <script src="./js/memo_form.js"></script>
</body>
</html>
