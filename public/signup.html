<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/signup.css">

    <title>회원 가입</title>
</head>
<body class="form-page">
    <form id="signup-form" class="form-container">
        <h1>회원 가입</h1>

        <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="id">아이디:</label>
            <input type="text" id="id" name="id" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="pwcheck">비밀번호 확인:</label>
            <input type="password" id="pwcheck" name="pwcheck" required>
        </div>

        <button type="submit" class="btn-submit">회원 가입</button>
    </form>

    <div>
        <p>이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
    </div>

    <div id="toast-container"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./js/common.js"></script> <script src="./js/signup.js"></script>
</body>
</html>
